name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Release tag must be a SemVer version prefixed with 'v'." >&2
            exit 1
          fi
          package_version="${BASH_REMATCH[1]}"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release commit must belong to the main branch." >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore JevNet.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format JevNet.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build JevNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JevNet.slnx --configuration Release --no-build

      - name: Audit dependencies
        run: dotnet list JevNet.slnx package --vulnerable --include-transitive

      - name: Pack
        run: >-
          dotnet pack JevNet.slnx
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion="$PACKAGE_VERSION"

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/JevNet.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          dotnet nuget push "artifacts/JevNet.Extensions.DependencyInjection.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
