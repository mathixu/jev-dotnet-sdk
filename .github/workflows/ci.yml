name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore JevNet.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format JevNet.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build JevNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JevNet.slnx --configuration Release --no-build

      - name: Audit dependencies
        run: dotnet list JevNet.slnx package --vulnerable --include-transitive

      - name: Pack
        run: dotnet pack JevNet.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
          if-no-files-found: error
