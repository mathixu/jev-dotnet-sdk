name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore JevNet.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format JevNet.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build JevNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JevNet.slnx --configuration Release --no-build

      - name: Audit dependencies
        run: dotnet list JevNet.slnx package --vulnerable --include-transitive

      - name: Pack
        run: dotnet pack JevNet.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
          if-no-files-found: error
